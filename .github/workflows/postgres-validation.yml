name: PostgreSQL schema validation

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Apply schema and check constraints
        run: |
          trap 'docker rm -f bloom-postgres >/dev/null 2>&1 || true' EXIT
          docker run --detach --name bloom-postgres --network none \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env POSTGRES_DB=bloom_med_test \
            --volume "$GITHUB_WORKSPACE/backend/postgres:/sql:ro" postgres:16
          for attempt in $(seq 1 30); do
            if docker exec bloom-postgres pg_isready -h 127.0.0.1 -U postgres -d bloom_med_test; then
              break
            fi
            sleep 2
          done
          docker exec bloom-postgres psql -X -U postgres -d bloom_med_test \
            --set=validation_schema=bloom_validation --file=/sql/validate.sql

  validate-hosted-dev:
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate the hosted development database if configured
        env:
          # Set DATABASE_URL in Settings > Environments > dev > Environment secrets.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGCONNECT_TIMEOUT: 10
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Hosted validation skipped. Set DATABASE_URL in the dev environment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          psql -X --dbname="$DATABASE_URL" --set="validation_schema=bloom_validation_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" --file=backend/postgres/validate.sql
