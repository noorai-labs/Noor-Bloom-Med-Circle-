name: Deploy development and QA backend
on:
  push:
    branches: [dev, qa]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: backend-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  approved-merge:
    name: Verify approved PR merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const repo = context.repo;
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, { ...repo, commit_sha: context.sha });
            const match = pulls.find(pr => pr.base.ref === context.ref.replace('refs/heads/', '') && pr.merged_at && pr.merge_commit_sha === context.sha);
            if (!match) throw new Error('Backend deployments require an approved PR merged into dev or qa.');
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: match.number });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...repo, pull_number: pr.number });
            const latest = new Map();
            for (const review of reviews) {
              if (review.user?.type !== 'User' || review.user.login === pr.user.login) continue;
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) latest.set(review.user.login, review);
            }
            let approved = false;
            for (const [username, review] of latest) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...repo, username });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) continue;
              if (review.state === 'CHANGES_REQUESTED') throw new Error('An eligible reviewer still requests changes.');
              if (username.toLowerCase() === 'anc-dominater' && review.state === 'APPROVED' && review.commit_id === pr.head.sha) approved = true;
            }
            if (!approved) throw new Error('ANC-DOMINATER must independently approve the latest PR head before backend deployment.');
            await core.summary.addHeading('Approved backend merge').addRaw(`PR #${pr.number} passed review verification. Commit: ${context.sha}`).write();
  validate:
    needs: approved-merge
    uses: ./.github/workflows/validate.yml
  deploy:
    name: Deploy isolated backend
    needs: [approved-merge, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5f60fb51e83a434162045c3ba7049f9a
      TARGET_ENV: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add the development-account CLOUDFLARE_API_TOKEN to this GitHub environment."; exit 1; }
          case "$TARGET_ENV" in dev|qa) ;; *) exit 1 ;; esac
      - name: Apply environment database migrations
        run: npx --no-install wrangler d1 migrations apply "bloom-med-$TARGET_ENV" --remote --config backend/wrangler.nonprod.jsonc --env "$TARGET_ENV"
      - name: Deploy Worker
        run: npx --no-install wrangler deploy --config backend/wrangler.nonprod.jsonc --env "$TARGET_ENV"
