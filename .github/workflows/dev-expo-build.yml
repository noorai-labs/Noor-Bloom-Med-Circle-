name: Dev Expo build
on:
  push:
    branches: [dev]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: dev-expo-${{ github.sha }}
  cancel-in-progress: false
jobs:
  approved-merge:
    name: Verify approved PR merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const repo = context.repo;
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, { ...repo, commit_sha: context.sha });
            const match = pulls.find(pr => pr.base.ref === 'dev' && pr.merged_at && pr.merge_commit_sha === context.sha);
            if (!match) throw new Error('Expo builds require a PR merged into dev. Direct pushes do not trigger builds.');
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: match.number });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...repo, pull_number: pr.number });
            const latest = new Map();
            for (const review of reviews) {
              if (review.user?.type !== 'User' || review.user.login === pr.user.login) continue;
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) latest.set(review.user.login, review);
            }
            let approved = false;
            for (const [username, review] of latest) {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...repo, username });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) continue;
              if (review.state === 'CHANGES_REQUESTED') throw new Error('An eligible reviewer still requests changes.');
              if (review.state === 'APPROVED' && review.commit_id === pr.head.sha) approved = true;
            }
            if (!approved) throw new Error('At least one non-author write/admin reviewer must approve the latest PR head before the Expo build.');
            await core.summary.addHeading('Approved dev merge').addRaw(`PR #${pr.number} passed review verification. Commit: ${context.sha}`).write();
  validate:
    needs: approved-merge
    uses: ./.github/workflows/validate.yml
  expo:
    name: Build Android APK on Expo
    needs: [approved-merge, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository owner must add the EXPO_TOKEN Actions secret."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 27.7.2
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Queue Android preview build
        run: eas build --platform android --profile preview --non-interactive --no-wait --json > eas-build.json
      - name: Add Expo build link
        run: |
          node -e 'const fs=require("fs");const builds=JSON.parse(fs.readFileSync("eas-build.json","utf8"));for(const build of Array.isArray(builds)?builds:[builds])fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Android build queued: https://expo.dev/accounts/dominateranc/projects/bloom-med/builds/${build.id}\n`);'
