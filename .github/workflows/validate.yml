name: PR checks
on:
  pull_request:
    branches: [dev, qa]
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:backend
      - run: node scripts/workflow-review-test.cjs
      - run: node scripts/workflow-review-test.cjs .github/workflows/backend-deploy.yml dev
      - run: node scripts/workflow-review-test.cjs .github/workflows/backend-deploy.yml qa
      - run: npm test
      - run: npm run test:cloud
